{{define "page"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Tracker</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
:root{--bg:#fafafa;--ink:#1a1d1f;--mute:#6b7280;--line:#e5e7eb;--green:#047857;--red:#b91c1c;--card:#fff;--soft:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:764px;margin:0 auto;padding:28px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:18px;margin:0 0 4px;font-weight:600}
.sub{margin:0;color:var(--mute);font-size:13px}
.btn{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.del{color:var(--red);border-color:#fecaca}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;font-size:13px;padding:7px 14px}
.btn.big{font-size:13px;padding:7px 12px}
.nav{display:flex;gap:6px;margin:22px 0 22px;align-items:center}
.nav select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-left:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#4b5563;font-weight:600;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
td{padding:14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.num{text-align:right;white-space:nowrap}
.act{text-align:right;white-space:nowrap}
.act .btn{font-size:11px;padding:4px 8px;margin-left:2px}
.pos{color:var(--green)}.neg{color:var(--red)}
.dot::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:8px;vertical-align:middle;background:var(--red)}
.dot.inc::before{background:var(--green)}
.total td{background:var(--soft);font-weight:600;border-bottom:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute)}
.stats div:last-child{border-right:0}
.stats b{display:block;margin-top:4px;font-size:15px;letter-spacing:0;text-transform:none}
.add{padding:14px}
.card h2{font-size:13px;font-weight:500;margin:0;padding:14px;border-bottom:1px solid var(--line)}
.sum td:first-child,.sum th:first-child{padding-left:14px}
.sum td{padding:8px 14px}
.sum tr.cur td{background:#f4f7fb;font-weight:600}
.sum tr:last-child td{border-bottom:0}
.empty{text-align:center;color:var(--mute);padding:28px}
.err{margin:0 0 14px;padding:9px 12px;background:#fef2f2;border:1px solid #fecaca;color:var(--red);border-radius:6px;font-size:13px}
tr.editing td{background:#fcfcfd}
td input,td select{font:inherit;font-size:13px;padding:5px 7px;border:1px solid #cbd0d6;border-radius:6px;width:100%;background:#fff}
td.num input{text-align:right}
.login{max-width:384px;margin:80px auto 0;padding:0 16px}
.login h1{text-align:center;font-size:19px}
.login .sub{text-align:center;margin-bottom:30px}
.login .box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:34px 24px 24px}
.login label{display:block;font-weight:600;font-size:13px;margin-bottom:7px}
.login input{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;outline:0}
.login button{width:100%;margin-top:12px;padding:11px;font:inherit;font-weight:600;font-size:13px;background:var(--ink);color:#fff;border:0;border-radius:6px;cursor:pointer}
.htmx-request{opacity:.7}
.nav{flex-wrap:wrap}
@media(max-width:640px){
  .wrap{padding:18px 12px 48px}
  .top{gap:12px}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .nav select{margin:0;width:100%}
  .nav select[name=month]{grid-column:1 / 3}
  .nav select[name=year]{grid-column:3}
  .btn{min-height:38px}
  .nav select,td input,td select{font-size:16px;min-height:38px}

  .stats{grid-template-columns:1fr}
  .stats div{border-right:0}

  table.tx thead{display:none}
  table.tx,table.tx tbody,table.tx tr,table.tx td{display:block;width:100%}
  table.tx tr{padding:12px 14px;border-bottom:1px solid var(--line)}
  table.tx td{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border:0;text-align:right}
  table.tx td::before{content:attr(data-label);flex:0 0 76px;color:var(--mute);font-size:11px;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding-top:2px}
  table.tx td:not([data-label])::before{display:none}
  table.tx td:empty{display:none}
  table.tx td.act{justify-content:flex-end;padding-top:10px}
  table.tx td.act .btn{min-height:34px;padding:4px 12px}
  table.tx td input,table.tx td select{flex:1;min-width:0;width:auto}
  table.tx tr.total{background:var(--soft)}
  table.tx tr.total td{background:none}

  .sum td,.sum th{padding:8px 10px;font-size:12px}
}
</style>
</head>
<body hx-target="#root">
<div id="root">{{if .Authed}}{{template "app" .V}}{{else}}{{template "login" .}}{{end}}</div>
<script>
document.body.addEventListener("htmx:afterSettle", function () {
  var row = document.querySelector("tr.editing");
  if (!row) return;
  row.scrollIntoView({ behavior: "smooth", block: "nearest" });
  var amount = row.querySelector("input[name=amount]");
  if (amount) amount.focus({ preventScroll: true });
});
</script>
</body>
</html>{{end}}
