services:
  - type: web
    name: financial-tracker
    runtime: go
    plan: free
    buildCommand: go build -o app .
    startCommand: ./app
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: APP_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_TABLE
        value: transactions
      - key: TZ_NAME
        value: Asia/Bangkok
